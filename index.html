<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>دوره باهوش</title>

  <script src="https://developer.eitaa.com/eitaa-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      font-family: Tahoma, Arial, sans-serif;
      background:
        radial-gradient(
          circle at top right,
          #24105c 0%,
          #0b0920 35%,
          #050511 75%,
          #020208 100%
        );
      color: #fff;
      min-height: 100vh;
      user-select: none;
      -webkit-user-select: none;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      width: 300px;
      height: 300px;
      top: -120px;
      right: -100px;
      background:
        radial-gradient(
          circle,
          rgba(162, 89, 255, 0.35),
          transparent 70%
        );
      filter: blur(20px);
      pointer-events: none;
      z-index: 0;
    }

    body::after {
      content: "";
      position: fixed;
      width: 250px;
      height: 250px;
      bottom: -120px;
      left: -100px;
      background:
        radial-gradient(
          circle,
          rgba(0, 229, 255, 0.20),
          transparent 70%
        );
      filter: blur(20px);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      width: 100%;
      max-width: 760px;
      margin: auto;
      padding: 16px 14px 50px;
      position: relative;
      z-index: 1;
    }

    .card {
      background:
        linear-gradient(
          145deg,
          rgba(28, 22, 62, 0.92),
          rgba(10, 9, 27, 0.96)
        );
      border: 1px solid rgba(177, 104, 255, 0.22);
      border-radius: 22px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow:
        0 0 30px rgba(112, 52, 255, 0.08);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .header {
      text-align: center;
      padding: 28px 18px 24px;
      border: 1px solid rgba(184, 105, 255, 0.35);
      box-shadow:
        0 0 35px rgba(136, 72, 255, 0.15);
    }

    .logo {
      width: 82px;
      height: 82px;
      margin: 0 auto 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 25px;
      font-size: 42px;
      background:
        linear-gradient(
          135deg,
          rgba(157, 78, 255, 0.25),
          rgba(0, 229, 255, 0.12)
        );
      border: 1px solid rgba(190, 120, 255, 0.5);
      box-shadow:
        0 0 25px rgba(155, 75, 255, 0.28);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 27px;
      background:
        linear-gradient(
          90deg,
          #fff,
          #b97aff,
          #65eaff
        );
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    h2 {
      margin: 0 0 14px;
      font-size: 20px;
    }

    p {
      line-height: 2;
      color: #c8c3d7;
    }

    .subtitle {
      margin: 0;
      color: #a9a3bd;
      font-size: 14px;
    }

    .status {
      text-align: center;
      padding: 35px 18px;
      color: #d8d2e8;
    }

    .loader {
      width: 38px;
      height: 38px;
      margin: 0 auto 15px;
      border: 3px solid rgba(255,255,255,0.12);
      border-top-color: #b36cff;
      border-right-color: #00e5ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .error {
      color: #ff9dba;
      background: rgba(255, 45, 100, 0.09);
      border: 1px solid rgba(255, 70, 120, 0.25);
      border-radius: 15px;
      padding: 15px;
      line-height: 1.9;
    }

    .success {
      color: #70ffd0;
    }

    .user-box {
      background: rgba(111, 69, 196, 0.10);
      border: 1px solid rgba(157, 104, 255, 0.18);
      border-radius: 15px;
      padding: 15px;
      line-height: 2;
      color: #ddd7eb;
    }
        .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .section-title h2 {
      margin: 0;
    }

    .badge {
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 11px;
      background: rgba(0, 229, 255, 0.08);
      color: #72efff;
      border: 1px solid rgba(0, 229, 255, 0.2);
    }

    .lesson {
      position: relative;
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 16px;
      margin-bottom: 12px;
      border-radius: 18px;
      background:
        linear-gradient(
          135deg,
          rgba(30, 24, 66, 0.95),
          rgba(13, 11, 34, 0.98)
        );
      border: 1px solid rgba(167, 96, 255, 0.18);
      transition:
        transform 0.2s,
        border-color 0.2s,
        box-shadow 0.2s;
      cursor: pointer;
    }

    .lesson:active {
      transform: scale(0.985);
    }

    .lesson:hover {
      border-color: rgba(174, 99, 255, 0.48);
      box-shadow:
        0 0 25px rgba(138, 67, 255, 0.12);
    }

    .lesson-number {
      min-width: 48px;
      height: 48px;
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        linear-gradient(
          135deg,
          rgba(162, 77, 255, 0.30),
          rgba(0, 221, 255, 0.10)
        );
      border: 1px solid rgba(179, 103, 255, 0.3);
      color: #dcb9ff;
      font-size: 14px;
    }

    .lesson-info {
      flex: 1;
      min-width: 0;
    }

    .lesson-title {
      font-size: 16px;
      font-weight: bold;
      color: #fff;
      margin-bottom: 5px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .lesson-description {
      color: #aaa4bb;
      font-size: 12px;
      line-height: 1.7;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .arrow {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: rgba(0, 229, 255, 0.07);
      border: 1px solid rgba(0, 229, 255, 0.18);
      color: #6fefff;
      font-size: 18px;
      flex-shrink: 0;
    }

    .detail-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .back-button {
      width: 43px;
      height: 43px;
      flex-shrink: 0;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #fff;
      background: rgba(160, 88, 255, 0.12);
      border: 1px solid rgba(175, 100, 255, 0.25);
      font-size: 20px;
    }

    .detail-title {
      flex: 1;
      min-width: 0;
    }

    .detail-title h2 {
      margin: 0 0 4px;
      font-size: 19px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .detail-title span {
      color: #8f8aa2;
      font-size: 11px;
    }

    .content-box {
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid rgba(174, 102, 255, 0.20);
      background: #05050d;
      margin-top: 14px;
    }

    video {
      display: block;
      width: 100%;
      max-height: 430px;
      background: #000;
    }

    audio {
      width: 100%;
      padding: 15px;
    }

    img.content-image {
      display: block;
      width: 100%;
      height: auto;
    }

    iframe {
      width: 100%;
      min-height: 520px;
      border: 0;
      display: block;
      background: white;
    }

    .text-content {
      white-space: pre-wrap;
      line-height: 2.1;
      color: #ddd8e8;
      padding: 20px;
      font-size: 15px;
    }
        .admin-title {
      color: #d7a4ff;
    }

    label {
      display: block;
      margin: 15px 0 7px;
      font-weight: bold;
      font-size: 13px;
      color: #d5cde3;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 13px;
      border-radius: 12px;
      border: 1px solid rgba(171, 110, 255, 0.20);
      background: rgba(4, 4, 15, 0.65);
      color: white;
      font-family: inherit;
      font-size: 14px;
      outline: none;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: rgba(0, 229, 255, 0.5);
      box-shadow:
        0 0 15px rgba(0, 229, 255, 0.07);
    }

    select option {
      background: #121022;
      color: white;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 13px;
      padding: 14px;
      margin-top: 16px;
      font-family: inherit;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      color: white;
      background:
        linear-gradient(
          90deg,
          #743cff,
          #b14cff,
          #00bfe8
        );
      box-shadow:
        0 0 22px rgba(126, 65, 255, 0.22);
    }

    button:disabled {
      opacity: 0.55;
    }

    .hidden {
      display: none !important;
    }

    .small {
      font-size: 12px;
      color: #88829a;
      line-height: 1.8;
    }

    .empty {
      text-align: center;
      padding: 25px 10px;
      color: #8e899c;
    }

    .upload-progress {
      margin-top: 12px;
      color: #78edff;
      font-size: 12px;
      line-height: 1.8;
    }

  </style>

</head>

<body>

  <div class="container">

    <div class="card header">

      <div class="logo">
        🤖
      </div>

      <h1>
        دوره باهوش
      </h1>

      <p class="subtitle">
        آموزش جامع و کاربردی تولید محتوا با هوش مصنوعی
      </p>

    </div>

    <div
      id="status"
      class="card status"
    >

      <div class="loader"></div>

      در حال بررسی اطلاعات شما...

    </div>

    <div
      id="app"
      class="hidden"
    >

      <div class="card">

        <h2>
          👋 خوش اومدی
        </h2>

        <div
          id="userInfo"
          class="user-box"
        ></div>

      </div>

      <div
        id="accessMessage"
        class="card hidden"
      ></div>

      <div
        id="lessonsSection"
        class="card hidden"
      >

        <div class="section-title">

          <h2>
            📚 آموزش‌های دوره
          </h2>

          <span
            id="lessonCount"
            class="badge"
          >
            ۰ آموزش
          </span>

        </div>

        <div id="lessonsList"></div>

      </div>
            <div
        id="detailSection"
        class="card hidden"
      >

        <div class="detail-header">

          <div
            id="backButton"
            class="back-button"
          >
            ◀️
          </div>

          <div class="detail-title">

            <h2 id="detailTitle">
              آموزش
            </h2>

            <span id="detailNumber">
              آموزش
            </span>

          </div>

        </div>

        <div
          id="detailDescription"
          class="small"
        ></div>

        <div
          id="detailContent"
          class="content-box"
        ></div>

      </div>

      <div
        id="adminPanel"
        class="card hidden"
      >

        <h2 class="admin-title">
          👑 پنل مدیریت
        </h2>

        <p>
          از این قسمت می‌تونی آموزش جدید اضافه کنی.
        </p>

        <form id="lessonForm">

          <label>
            عنوان آموزش
          </label>

          <input
            id="title"
            type="text"
            placeholder="مثلاً آموزش ساخت تصویر با هوش مصنوعی"
            required
          >

          <label>
            توضیحات
          </label>

          <textarea
            id="description"
            placeholder="توضیحات کوتاه آموزش"
          ></textarea>

          <label>
            نوع محتوا
          </label>

          <select id="contentType">

            <option value="video">
              🎬 ویدئو
            </option>

            <option value="audio">
              🎵 صوت
            </option>

            <option value="image">
              🖼 تصویر
            </option>

            <option value="file">
              📁 فایل
            </option>

            <option value="text">
              📝 متن
            </option>

          </select>

          <div id="fileBox">

            <label>
              فایل آموزش
            </label>

            <input
              id="file"
              type="file"
            >

            <p class="small">
              حداکثر حجم فعلی فایل: ۵۰ مگابایت
            </p>

          </div>

          <div
            id="textBox"
            class="hidden"
          >

            <label>
              متن آموزش
            </label>

            <textarea
              id="textContent"
              placeholder="متن آموزش را اینجا وارد کنید"
            ></textarea>

          </div>

          <label>
            زمان انتشار
          </label>

          <input
            id="publishAt"
            type="datetime-local"
          >

          <button
            id="submitButton"
            type="submit"
          >
            🚀 افزودن آموزش
          </button>

          <div
            id="uploadProgress"
            class="upload-progress"
          ></div>

          <div
            id="adminMessage"
            class="small"
            style="margin-top:12px;"
          ></div>

        </form>

      </div>

    </div>

  </div>

  <script>

    let webApp = null;
    let initData = "";
    let currentUser = null;
    let currentLessons = [];

    function setupEitaa() {

      try {

        if (
          window.Eitaa &&
          window.Eitaa.WebApp
        ) {

          webApp =
            window.Eitaa.WebApp;

          webApp.ready();
          webApp.expand();

          initData =
            webApp.initData || "";

        }

      } catch (error) {

        console.error(
          "Eitaa Error:",
          error
        );

      }

    }

    function setStatus(
      message,
      isError = false
    ) {

      const status =
        document.getElementById(
          "status"
        );

      status.innerHTML =
        isError
          ? `<div class="error">${message}</div>`
          : `
            <div class="loader"></div>
            ${message}
          `;

    }

    async function authenticate() {

      try {

        setupEitaa();

        if (!initData) {

          setStatus(
            "اطلاعات ورود ایتا دریافت نشد.<br><br>" +
            "لطفاً Mini App را مستقیماً از داخل ایتا باز کنید.",
            true
          );

          return;

        }

        setStatus(
          "در حال بررسی اطلاعات شما..."
        );

        const response =
          await fetch(
            "/api/auth",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({
                  initData:
                    initData
                })
            }
          );

        const data =
          await response.json();

        if (
          !response.ok ||
          !data.ok
        ) {

          throw new Error(
            data.error ||
            "احراز هویت ناموفق بود"
          );

        }

        currentUser =
          data;

        renderApp(data);

      } catch (error) {

        console.error(
          "Authentication Error:",
          error
        );

        setStatus(
          "خطا در ورود به دوره ❌<br><br>" +
          `<span class="small">${escapeHtml(
            error.message
          )}</span>`,
          true
        );

      }

    }

    function renderApp(data) {

      document
        .getElementById("status")
        .classList
        .add("hidden");

      document
        .getElementById("app")
        .classList
        .remove("hidden");

      const firstName =
        data.user?.first_name || "";

      const lastName =
        data.user?.last_name || "";

      const username =
        data.user?.username || "";

      let userHtml =
        `<strong>نام:</strong> ${escapeHtml(
          (firstName + " " + lastName).trim()
        )}`;

      if (username) {

        userHtml +=
          `<br><strong>نام کاربری:</strong> @${escapeHtml(
            username
          )}`;

      }

      if (data.isAdmin) {

        userHtml +=
          `<br><strong>وضعیت:</strong> 👑 مدیر دوره`;

      } else if (data.hasAccess) {

        userHtml +=
          `<br><strong>وضعیت:</strong> ✅ دسترسی فعال`;

      } else {

        userHtml +=
          `<br><strong>وضعیت:</strong> ❌ بدون دسترسی`;

      }

      document
        .getElementById("userInfo")
        .innerHTML =
        userHtml;

      const accessMessage =
        document.getElementById(
          "accessMessage"
        );

      if (
        !data.isAdmin &&
        !data.hasAccess
      ) {

        accessMessage
          .classList
          .remove("hidden");

        accessMessage.innerHTML = `

          <h2>
            🔒 دسترسی به دوره
          </h2>

          <p>
            حساب شما هنوز دسترسی فعال به آموزش‌های دوره ندارد.
          </p>

          <p>
            برای ثبت‌نام و فعال‌سازی دسترسی،
            با پشتیبانی دوره در ارتباط باشید.
          </p>

          <strong>
            آیدی ثبت‌نام:
            o0JABBAR0o
          </strong>

        `;

      }

      currentLessons =
        data.lessons || [];

      if (
        currentLessons.length > 0
      ) {

        document
          .getElementById(
            "lessonsSection"
          )
          .classList
          .remove("hidden");

        document
          .getElementById(
            "lessonCount"
          )
          .innerText =
          `${toPersianNumber(
            currentLessons.length
          )} آموزش`;

        renderLessons(
          currentLessons
        );

      } else if (
        data.isAdmin
      ) {

        document
          .getElementById(
            "lessonsSection"
          )
          .classList
          .remove("hidden");

        document
          .getElementById(
            "lessonsList"
          )
          .innerHTML = `

            <div class="empty">
              هنوز آموزشی اضافه نشده است.
            </div>

        `;

      }

      if (data.isAdmin) {

        document
          .getElementById(
            "adminPanel"
          )
          .classList
          .remove("hidden");

      }

    }
        function renderLessons(lessons) {

      const list =
        document.getElementById(
          "lessonsList"
        );

      list.innerHTML = "";

      lessons.forEach(
        (lesson, index) => {

          const div =
            document.createElement(
              "div"
            );

          div.className =
            "lesson";

          div.innerHTML = `

            <div class="lesson-number">
              ${toPersianNumber(index + 1)}
            </div>

            <div class="lesson-info">

              <div class="lesson-title">
                ${escapeHtml(
                  lesson.title || "بدون عنوان"
                )}
              </div>

              <div class="lesson-description">
                ${escapeHtml(
                  lesson.description ||
                  "برای مشاهده آموزش وارد شوید."
                )}
              </div>

            </div>

            <div class="arrow">
              ◀️
            </div>

          `;

          div.addEventListener(
            "click",
            function () {
              openLesson(index);
            }
          );

          list.appendChild(div);

        }
      );

    }

    function openLesson(index) {

      const lesson =
        currentLessons[index];

      if (!lesson) {
        return;
      }

      document
        .getElementById("lessonsSection")
        .classList
        .add("hidden");

      document
        .getElementById("adminPanel")
        .classList
        .add("hidden");

      document
        .getElementById("detailSection")
        .classList
        .remove("hidden");

      document
        .getElementById("detailTitle")
        .innerText =
        lesson.title || "آموزش";

      document
        .getElementById("detailNumber")
        .innerText =
        `آموزش ${toPersianNumber(index + 1)}`;

      document
        .getElementById("detailDescription")
        .innerText =
        lesson.description || "";

      renderLessonContent(lesson);

    }

    function renderLessonContent(lesson) {

      const box =
        document.getElementById(
          "detailContent"
        );

      box.innerHTML = "";

      const url =
        lesson.content_url;

      if (
        lesson.content_type === "video" &&
        url
      ) {

        box.innerHTML = `

          <video
            controls
            controlsList="nodownload noplaybackrate"
            disablePictureInPicture
            playsinline
            oncontextmenu="return false;"
          >

            <source
              src="${escapeAttribute(url)}"
            >

            مرورگر شما از پخش ویدئو پشتیبانی نمی‌کند.

          </video>

        `;

      } else if (
        lesson.content_type === "audio" &&
        url
      ) {

        box.innerHTML = `

          <audio
            controls
            controlsList="nodownload"
            oncontextmenu="return false;"
          >

            <source
              src="${escapeAttribute(url)}"
            >

          </audio>

        `;

      } else if (
        lesson.content_type === "image" &&
        url
      ) {

        box.innerHTML = `

          <img
            class="content-image"
            src="${escapeAttribute(url)}"
            draggable="false"
            oncontextmenu="return false;"
          >

        `;

      } else if (
        lesson.content_type === "file" &&
        url
      ) {

        box.innerHTML = `

          <iframe
            src="${escapeAttribute(url)}"
            oncontextmenu="return false;"
          ></iframe>

        `;

      } else if (
        lesson.content_type === "text"
      ) {

        box.innerHTML = `

          <div class="text-content">
            ${escapeHtml(url || "")}
          </div>

        `;

      } else if (url) {

        box.innerHTML = `

          <div
            style="
              padding:25px;
              text-align:center;
            "
          >

            <a
              href="${escapeAttribute(url)}"
              target="_blank"
              rel="noopener noreferrer"
              style="
                color:#70edff;
                text-decoration:none;
              "
            >
              مشاهده محتوا
            </a>

          </div>

        `;

      } else {

        box.innerHTML = `

          <div class="empty">
            محتوای این آموزش هنوز قرار نگرفته است.
          </div>

        `;

      }

    }

    document
      .getElementById("backButton")
      .addEventListener(
        "click",
        function () {

          document
            .getElementById("detailSection")
            .classList
            .add("hidden");

          document
            .getElementById("lessonsSection")
            .classList
            .remove("hidden");

          if (
            currentUser &&
            currentUser.isAdmin
          ) {

            document
              .getElementById("adminPanel")
              .classList
              .remove("hidden");

          }

        }
      );

    document
      .getElementById("contentType")
      .addEventListener(
        "change",
        function () {

          const type =
            this.value;

          const fileBox =
            document.getElementById("fileBox");

          const textBox =
            document.getElementById("textBox");

          if (
            type === "text"
          ) {

            fileBox
              .classList
              .add("hidden");

            textBox
              .classList
              .remove("hidden");

          } else {

            fileBox
              .classList
              .remove("hidden");

            textBox
              .classList
              .add("hidden");

          }

        }
      );

    document
      .getElementById("lessonForm")
      .addEventListener(
        "submit",
        async function (event) {

          event.preventDefault();

          const button =
            document.getElementById(
              "submitButton"
            );

          const message =
            document.getElementById(
              "adminMessage"
            );

          const progress =
            document.getElementById(
              "uploadProgress"
            );

          try {

            button.disabled = true;

            message.innerHTML = "";

            progress.innerText =
              "در حال شروع...";

            const title =
              document
                .getElementById("title")
                .value
                .trim();

            const description =
              document
                .getElementById("description")
                .value
                .trim();

            const contentType =
              document
                .getElementById("contentType")
                .value;

            const publishAt =
              document
                .getElementById("publishAt")
                .value;

            let contentUrl = null;

            if (!title) {

              throw new Error(
                "عنوان آموزش را وارد کنید."
              );

            }

            if (
              contentType === "text"
            ) {

              contentUrl =
                document
                  .getElementById("textContent")
                  .value
                  .trim();

              if (!contentUrl) {

                throw new Error(
                  "متن آموزش را وارد کنید."
                );

              }

            } else {

              const file =
                document
                  .getElementById("file")
                  .files[0];

              if (!file) {

                throw new Error(
                  "لطفاً فایل آموزش را انتخاب کنید."
                );

              }

              if (
                file.size >
                50 * 1024 * 1024
              ) {

                throw new Error(
                  "حجم فایل بیشتر از ۵۰ مگابایت است."
                );

              }

              progress.innerText =
                "در حال دریافت لینک امن آپلود...";

              const uploadResponse =
                await fetch(
                  "/api/upload-url",
                  {
                    method: "POST",

                    headers: {
                      "Content-Type":
                        "application/json"
                    },

                    body:
                      JSON.stringify({
                        initData:
                          initData,

                        fileName:
                          file.name,

                        contentType:
                          file.type ||
                          "application/octet-stream"
                      })
                  }
                );

              const uploadData =
                await uploadResponse.json();

              if (
                !uploadResponse.ok ||
                !uploadData.ok
              ) {

                throw new Error(
                  uploadData.error ||
                  "خطا در دریافت لینک آپلود."
                );

              }

              progress.innerText =
                "در حال آپلود فایل...";

              const supabaseUrl =
                await getSupabaseUrl();

              const uploadUrl =
                `${supabaseUrl}/storage/v1/object/upload/sign/course-videos/${encodeURIComponent(
                  uploadData.path
                )}?token=${encodeURIComponent(
                  uploadData.token
                )}`;

              const fileResponse =
                await fetch(
                  uploadUrl,
                  {
                    method: "PUT",

                    headers: {
                      "Content-Type":
                        file.type ||
                        "application/octet-stream"
                    },

                    body: file
                  }
                );

              if (
                !fileResponse.ok
              ) {

                const errorText =
                  await fileResponse.text();

                console.error(
                  "Upload Error:",
                  errorText
                );

                throw new Error(
                  "آپلود فایل انجام نشد. دوباره امتحان کنید."
                );

              }

              progress.innerText =
                "✅ فایل با موفقیت آپلود شد.";

              contentUrl =
                uploadData.path;

            }

            progress.innerText =
              "در حال ثبت آموزش...";

            const lessonResponse =
              await fetch(
                "/api/create-lesson",
                {
                  method: "POST",

                  headers: {
                    "Content-Type":
                      "application/json"
                  },

                  body:
                    JSON.stringify({
                      initData:
                        initData,

                      title:
                        title,

                      description:
                        description,

                      contentType:
                        contentType,

                      contentUrl:
                        contentUrl,

                      publishAt:
                        publishAt
                          ? new Date(
                              publishAt
                            ).toISOString()
                          : null
                    })
                }
              );

            const lessonData =
              await lessonResponse.json();

            if (
              !lessonResponse.ok ||
              !lessonData.ok
            ) {

              throw new Error(
                lessonData.error ||
                "فایل آپلود شد ولی ثبت آموزش انجام نشد."
              );

            }

            message.innerHTML = `
              <div class="success">
                ✅ آموزش با موفقیت اضافه شد.
              </div>
            `;

            progress.innerText = "";

            document
              .getElementById("lessonForm")
              .reset();

            document
              .getElementById("textBox")
              .classList
              .add("hidden");

            document
              .getElementById("fileBox")
              .classList
              .remove("hidden");

            setTimeout(
              authenticate,
              700
            );

          } catch (error) {

            console.error(
              "Create Lesson Error:",
              error
            );

            progress.innerText = "";

            message.innerHTML = `
              <div class="error">
                ❌ ${escapeHtml(
                  error.message
                )}
              </div>
            `;

          } finally {

            button.disabled = false;

          }

        }
      );

    let supabaseUrlCache = null;

    async function getSupabaseUrl() {

      if (
        supabaseUrlCache
      ) {

        return supabaseUrlCache;

      }

      const response =
        await fetch(
          "/api/config"
        );

      const data =
        await response.json();

      if (
        !response.ok ||
        !data.ok
      ) {

        throw new Error(
          "تنظیمات Supabase دریافت نشد."
        );

      }

      supabaseUrlCache =
        data.supabaseUrl;

      return supabaseUrlCache;

    }

    document.addEventListener(
      "contextmenu",
      function (event) {
        event.preventDefault();
      }
    );

    document.addEventListener(
      "dragstart",
      function (event) {
        event.preventDefault();
      }
    );

    document.addEventListener(
      "selectstart",
      function (event) {
        event.preventDefault();
      }
    );

    document.addEventListener(
      "keydown",
      function (event) {

        if (
          event.ctrlKey ||
          event.metaKey
        ) {

          const key =
            event.key.toLowerCase();

          if (
            key === "s" ||
            key === "u" ||
            key === "c" ||
            key === "a"
          ) {

            event.preventDefault();

          }

        }

        if (
          event.key === "F12"
        ) {

          event.preventDefault();

        }

      }
    );

    function escapeHtml(value) {

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }

    function escapeAttribute(value) {

      return escapeHtml(value);

    }

    function toPersianNumber(value) {

      return String(value)
        .replace(
          /\d/g,
          function (digit) {

            return "۰۱۲۳۴۵۶۷۸۹"[
              Number(digit)
            ];

          }
        );

    }

    authenticate();

  </script>

</body>

</html>
