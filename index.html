<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://developer.eitaa.com/eitaa-web-app.js"></script>

  <title>باهوش</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      background: #ffffff !important;
      color: #222222 !important;
      font-family: Tahoma, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
    }

    .container {
      text-align: center;
      padding: 50px 20px;
    }

    h1 {
      color: #222222;
      margin-bottom: 15px;
    }

    #status {
      color: #555555;
      font-size: 15px;
    }

    #userInfo {
      margin-top: 25px;
    }

    .info-box {
      max-width: 420px;
      margin: 0 auto;
      padding: 20px;
      border-radius: 16px;
      background: #f7f7f7;
      border: 1px solid #eeeeee;
      color: #222222;
      line-height: 1.9;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>باهوش 🤖</h1>

    <p id="status">
      در حال بررسی اطلاعات شما...
    </p>

    <div id="userInfo"></div>

  </div>

  <script>

    const webApp = window.Eitaa.WebApp;

    webApp.ready();
    webApp.expand();

    const status = document.getElementById("status");
    const userInfo = document.getElementById("userInfo");

    async function authenticate() {

      try {

        if (!webApp.initData) {
          throw new Error("اطلاعات ورود ایتا دریافت نشد");
        }

        const response = await fetch("/api/auth", {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            initData: webApp.initData
          })
        });

        const result = await response.json();

        if (!response.ok || !result.ok) {
          throw new Error(result.error || "خطای سرور");
        }

        const user = result.user || {};

        const fullName =
          `${user.first_name || ""} ${user.last_name || ""}`.trim();

        userInfo.innerHTML = `
          <div class="info-box">

            <p>👤 ${fullName || "کاربر"}</p>

            <p>🆔 شناسه ایتا: ${user.id}</p>

            <p>
              👑 ادمین:
              ${result.isAdmin ? "بله ✅" : "خیر"}
            </p>

            <p>
              📝 ثبت‌نام:
              ${result.registered ? "بله ✅" : "خیر"}
            </p>

            <p>
              🔐 دسترسی دوره:
              ${result.hasAccess ? "فعال ✅" : "غیرفعال ❌"}
            </p>

          </div>
        `;

        if (result.isAdmin) {

          status.textContent =
            "ورود موفق بود — پنل مدیریت آماده است 👑";

        } else if (result.hasAccess) {

          status.textContent =
            "ورود موفق بود — خوش آمدید 🌱";

        } else if (result.registered) {

          status.textContent =
            "ثبت‌نام شما انجام شده، اما دسترسی دوره فعال نیست.";

        } else {

          status.textContent =
            "شما هنوز در دوره ثبت‌نام نکرده‌اید.";

        }

      } catch (error) {

        console.error(error);

        status.textContent =
          error.message || "ارتباط با سرور برقرار نشد ❌";

      }

    }

    authenticate();

  </script>

</body>

</html>
