<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://developer.eitaa.com/eitaa-web-app.js"></script>

  <title>باهوش | دستیار دوره</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: #f5f7fb;
      color: #1f2937;
    }

    .container {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    .logo {
      width: 80px;
      height: 80px;
      margin: 0 auto 20px;
      border-radius: 22px;
      background: #111827;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
    }

    h1 {
      margin: 0;
      text-align: center;
      font-size: 28px;
      font-weight: 800;
    }

    .subtitle {
      margin: 10px 0 28px;
      color: #6b7280;
      line-height: 1.9;
      font-size: 14px;
      text-align: center;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 22px;
      margin-bottom: 15px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
    }

    .welcome {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .status {
      font-size: 14px;
      color: #6b7280;
      line-height: 1.8;
    }

    .admin-panel {
      display: none;
    }

    .admin-title {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .admin-subtitle {
      color: #6b7280;
      font-size: 14px;
      line-height: 1.8;
      margin-bottom: 20px;
    }

    .admin-button {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 15px;
      margin-top: 10px;
      background: #111827;
      color: white;
      font-size: 15px;
      font-family: inherit;
      cursor: pointer;
    }

    .admin-button:active {
      transform: scale(0.98);
    }

    .error {
      color: #dc2626;
    }

    .loading {
      color: #6b7280;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">🤖</div>

    <h1>باهوش</h1>

    <div class="subtitle">
      دستیار هوشمند دوره باهوش<br>
      همراه شما در مسیر یادگیری هوش مصنوعی
    </div>

    <!-- صفحه ورود -->
    <div id="userCard" class="card">

      <div id="userName" class="welcome">
        در حال بررسی...
      </div>

      <div id="status" class="status loading">
        در حال تأیید هویت شما توسط سرور...
      </div>

    </div>

    <!-- پنل ادمین -->
    <div id="adminPanel" class="admin-panel">

      <div class="card">

        <div class="admin-title">
          پنل مدیریت 👑
        </div>

        <div class="admin-subtitle">
          به پنل مدیریت دوره باهوش خوش آمدید.
          از این قسمت می‌توانید محتوای دوره و هنرجویان را مدیریت کنید.
        </div>

        <button class="admin-button">
          📚 مدیریت فصل‌ها
        </button>

        <button class="admin-button">
          🎬 مدیریت جلسات و ویدئوها
        </button>

        <button class="admin-button">
          👨‍🎓 مدیریت هنرجویان
        </button>

        <button class="admin-button">
          📊 مشاهده پیشرفت هنرجویان
        </button>

      </div>

    </div>

  </div>

  <script>
    const webApp = window.Eitaa.WebApp;

    webApp.ready();
    webApp.expand();

    const userCard = document.getElementById("userCard");
    const userNameElement = document.getElementById("userName");
    const statusElement = document.getElementById("status");
    const adminPanel = document.getElementById("adminPanel");

    async function authenticateUser() {

      const initData = webApp.initData;

      if (!initData) {
        userNameElement.textContent =
          "کاربر شناسایی نشد";

        statusElement.textContent =
          "اطلاعات ورود ایتا دریافت نشد.";

        statusElement.className =
          "status error";

        return;
      }

      try {

        const response = await fetch("/api/auth", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            initData: initData
          })
        });

        const result = await response.json();

        if (!response.ok || !result.ok) {
          throw new Error(
            result.error || "احراز هویت ناموفق بود"
          );
        }

        const user = result.user;

        const fullName =
          `${user.first_name || ""} ${user.last_name || ""}`.trim();

        userNameElement.textContent =
          fullName || "کاربر باهوش";

        if (result.isAdmin === true) {

          statusElement.textContent =
            "شما به عنوان مدیر باهوش شناسایی شدید ✅";

          statusElement.className =
            "status";

          adminPanel.style.display = "block";

        } else {

          statusElement.textContent =
            "ورود شما با موفقیت انجام شد.";

          statusElement.className =
            "status";

        }

      } catch (error) {

        console.error("خطای احراز هویت:", error);

        userNameElement.textContent =
          "احراز هویت ناموفق بود";

        statusElement.textContent =
          error.message || "خطایی در ارتباط با سرور رخ داد.";

        statusElement.className =
          "status error";
      }
    }

    authenticateUser();
  </script>

</body>
</html>
