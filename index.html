<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://developer.eitaa.com/eitaa-web-app.js"></script>

  <title>باهوش</title>
</head>

<body>

  <div style="text-align:center; padding:50px 20px; font-family:Tahoma;">

    <h1>باهوش 🤖</h1>

    <p id="status">
      در حال بررسی ارتباط با ایتا...
    </p>

  </div>

  <script>

    const status = document.getElementById("status");

    try {

      const webApp = window.Eitaa.WebApp;

      webApp.ready();
      webApp.expand();

      const initData = webApp.initData;

      if (initData) {

        status.textContent =
          "ارتباط با ایتا برقرار است ✅";

      } else {

        status.textContent =
          "Mini App اجرا شد، اما initData دریافت نشد ❌";

      }

    } catch (error) {

      console.error(error);

      status.textContent =
        "خطا در اجرای Eitaa WebApp ❌";

    }

  </script>

</body>
</html>
