<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://developer.eitaa.com/eitaa-web-app.js"></script>

  <title>باهوش | دستیار دوره</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: #f5f7fb;
      color: #1f2937;
    }

    .container {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      padding: 50px 20px;
      text-align: center;
    }

    .logo {
      width: 90px;
      height: 90px;
      margin: 0 auto 22px;
      border-radius: 25px;
      background: #111827;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 45px;
    }

    h1 {
      margin: 0;
      font-size: 30px;
      font-weight: 800;
    }

    .subtitle {
      margin: 12px 0 30px;
      color: #6b7280;
      line-height: 1.9;
      font-size: 15px;
    }

    .user-box {
      background: white;
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
    }

    .user-title {
      font-size: 14px;
      color: #6b7280;
      margin-bottom: 8px;
    }

    #userName {
      font-size: 20px;
      font-weight: bold;
    }

    .user-id {
      margin-top: 12px;
      padding: 10px;
      background: #f3f4f6;
      border-radius: 10px;
      font-size: 14px;
      direction: ltr;
      word-break: break-all;
    }

    .status {
      margin-top: 14px;
      font-size: 13px;
    }

    .success {
      color: #16a34a;
    }

    .error {
      color: #dc2626;
    }

    .loading {
      color: #6b7280;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">🤖</div>

    <h1>باهوش</h1>

    <div class="subtitle">
      دستیار هوشمند دوره باهوش<br>
      همراه شما در مسیر یادگیری هوش مصنوعی
    </div>

    <div class="user-box">

      <div class="user-title">
        وضعیت ورود
      </div>

      <div id="userName">
        در حال بررسی...
      </div>

      <div id="userId" class="user-id">
        شناسه در حال دریافت...
      </div>

      <div id="status" class="status loading">
        در حال تأیید هویت شما توسط سرور...
      </div>

    </div>

  </div>

  <script>
    const webApp = window.Eitaa.WebApp;

    webApp.ready();
    webApp.expand();

    const userNameElement = document.getElementById("userName");
    const userIdElement = document.getElementById("userId");
    const statusElement = document.getElementById("status");

    async function authenticateUser() {

      const initData = webApp.initData;

      if (!initData) {
        userNameElement.textContent = "کاربر شناسایی نشد";

        userIdElement.textContent =
          "شناسه دریافت نشد";

        statusElement.textContent =
          "اطلاعات ورود ایتا دریافت نشد.";

        statusElement.className = "status error";

        return;
      }

      try {

        const response = await fetch("/api/auth", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            initData: initData
          })
        });

        const result = await response.json();

        if (!response.ok || !result.ok) {
          throw new Error(
            result.error || "احراز هویت ناموفق بود"
          );
        }

        const user = result.user;

        const fullName =
          `${user.first_name || ""} ${user.last_name || ""}`.trim();

        userNameElement.textContent =
          fullName || "کاربر باهوش";

        userIdElement.textContent =
          `Eitaa User ID: ${user.id}`;

        statusElement.textContent =
          "هویت شما با موفقیت توسط سرور تأیید شد ✅";

        statusElement.className =
          "status success";

        console.log("Eitaa User ID:", user.id);

      } catch (error) {

        console.error("خطای احراز هویت:", error);

        userNameElement.textContent =
          "احراز هویت ناموفق بود";

        userIdElement.textContent =
          "شناسه دریافت نشد";

        statusElement.textContent =
          error.message || "خطایی در ارتباط با سرور رخ داد.";

        statusElement.className = "status error";
      }
    }

    authenticateUser();
  </script>

</body>
</html>
