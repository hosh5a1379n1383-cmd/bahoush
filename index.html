<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>دوره باهوش</title>

  <script src="https://developer.eitaa.com/eitaa-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: #f5f7fb;
      color: #222;
      user-select: none;
      -webkit-user-select: none;
    }

    .container {
      width: 100%;
      max-width: 700px;
      margin: auto;
      padding: 20px 14px 40px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.06);
    }

    .header {
      text-align: center;
      padding: 25px 15px;
    }

    .logo {
      font-size: 42px;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 25px;
    }

    h2 {
      font-size: 20px;
      margin-top: 0;
    }

    p {
      line-height: 1.9;
      color: #555;
    }

    .status {
      text-align: center;
      padding: 35px 15px;
      font-size: 16px;
    }

    .error {
      color: #c62828;
      background: #ffebee;
      border-radius: 12px;
      padding: 15px;
      line-height: 1.9;
    }

    .success {
      color: #2e7d32;
    }

    .user-box {
      background: #f0f4ff;
      border-radius: 14px;
      padding: 15px;
      line-height: 2;
    }

    .lesson {
      border: 1px solid #eee;
      border-radius: 15px;
      padding: 16px;
      margin-bottom: 12px;
      background: #fff;
    }

    .lesson-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .lesson-description {
      font-size: 14px;
      color: #666;
      line-height: 1.8;
      margin-bottom: 12px;
    }

    .lesson-number {
      display: inline-block;
      background: #eef2ff;
      border-radius: 8px;
      padding: 4px 9px;
      font-size: 12px;
      margin-bottom: 8px;
    }

    video {
      width: 100%;
      max-height: 420px;
      border-radius: 12px;
      background: #000;
    }

    audio {
      width: 100%;
    }

    img.content-image {
      width: 100%;
      border-radius: 12px;
    }

    iframe {
      width: 100%;
      min-height: 500px;
      border: 0;
      border-radius: 12px;
    }

    .text-content {
      white-space: pre-wrap;
      line-height: 2;
      background: #fafafa;
      padding: 15px;
      border-radius: 12px;
    }

    .admin-title {
      color: #7b1fa2;
    }

    label {
      display: block;
      margin: 14px 0 7px;
      font-weight: bold;
      font-size: 14px;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-family: inherit;
      font-size: 14px;
      background: white;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 13px;
      margin-top: 15px;
      font-family: inherit;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      background: #4f46e5;
      color: white;
    }

    button:disabled {
      opacity: 0.6;
    }

    .hidden {
      display: none !important;
    }

    .small {
      font-size: 12px;
      color: #777;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="card header">
      <div class="logo">🤖</div>
      <h1>دوره باهوش</h1>
      <p>دوره آموزشی تولید محتوا با هوش مصنوعی</p>
    </div>

    <div id="status" class="card status">
      در حال بررسی اطلاعات شما...
    </div>

    <div id="app" class="hidden">

      <div class="card">
        <h2>👋 خوش آمدید</h2>

        <div id="userInfo" class="user-box"></div>
      </div>

      <div id="accessMessage" class="card hidden"></div>

      <div id="lessonsSection" class="card hidden">

        <h2>📚 آموزش‌های دوره</h2>

        <div id="lessonsList"></div>

      </div>

      <div id="adminPanel" class="card hidden">

        <h2 class="admin-title">⚙️ پنل مدیریت</h2>

        <p>
          از این بخش می‌توانید آموزش جدید اضافه کنید.
        </p>

        <form id="lessonForm">

          <label>
            عنوان آموزش
          </label>

          <input
            id="title"
            type="text"
            placeholder="مثلاً آموزش ساخت تصویر با هوش مصنوعی"
            required
          >

          <label>
            توضیحات
          </label>

          <textarea
            id="description"
            placeholder="توضیحات کوتاه درباره این آموزش"
          ></textarea>

          <label>
            نوع محتوا
          </label>

          <select id="contentType">

            <option value="video">
              🎬 ویدئو
            </option>

            <option value="audio">
              🎵 صوت
            </option>

            <option value="image">
              🖼 تصویر
            </option>

            <option value="file">
              📁 فایل
            </option>

            <option value="text">
              📝 متن
            </option>

          </select>

          <div id="fileBox">

            <label>
              فایل آموزش
            </label>

            <input
              id="file"
              type="file"
            >

            <p class="small">
              حداکثر حجم فایل: ۵۰ مگابایت
            </p>

          </div>

          <div id="textBox" class="hidden">

            <label>
              متن آموزش
            </label>

            <textarea
              id="textContent"
              placeholder="متن آموزش را اینجا وارد کنید"
            ></textarea>

          </div>

          <label>
            زمان انتشار
          </label>

          <input
            id="publishAt"
            type="datetime-local"
          >

          <button
            id="submitButton"
            type="submit"
          >
            ➕ افزودن آموزش
          </button>

        </form>

        <div
          id="adminMessage"
          class="small"
          style="margin-top:15px;"
        ></div>

      </div>

    </div>

  </div>

  <script>

    let webApp = null;
    let initData = "";
    let currentUser = null;

    function setupEitaa() {

      try {

        if (
          window.Eitaa &&
          window.Eitaa.WebApp
        ) {

          webApp =
            window.Eitaa.WebApp;

          webApp.ready();
          webApp.expand();

          initData =
            webApp.initData || "";

        }

      } catch (error) {

        console.error(
          "Eitaa Error:",
          error
        );

      }

    }

    function setStatus(message, isError = false) {

      const status =
        document.getElementById("status");

      status.innerHTML =
        isError
          ? `<div class="error">${message}</div>`
          : message;

    }

    async function authenticate() {

      try {

        setupEitaa();

        if (!initData) {

          setStatus(
            "اطلاعات ورود ایتا دریافت نشد.<br><br>" +
            "لطفاً Mini App را مستقیماً از داخل ایتا باز کنید.",
            true
          );

          return;

        }

        setStatus(
          "در حال بررسی اطلاعات شما... ⏳"
        );

        const response =
          await fetch(
            "/api/auth",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({
                initData:
                  initData
              })
            }
          );

        const data =
          await response.json();

        if (!response.ok || !data.ok) {

          throw new Error(
            data.error ||
            "احراز هویت ناموفق بود"
          );

        }

        currentUser =
          data;

        renderApp(data);

      } catch (error) {

        console.error(
          "Authentication Error:",
          error
        );

        setStatus(
          "خطا در ورود به دوره ❌<br><br>" +
          `<span class="small">${error.message}</span>`,
          true
        );

      }

    }

    function renderApp(data) {

      document
        .getElementById("status")
        .classList
        .add("hidden");

      document
        .getElementById("app")
        .classList
        .remove("hidden");

      const firstName =
        data.user?.first_name || "";

      const lastName =
        data.user?.last_name || "";

      const username =
        data.user?.username || "";

      let userHtml =
        `<strong>نام:</strong> ${escapeHtml(
          firstName + " " + lastName
        )}`;

      if (username) {

        userHtml +=
          `<br><strong>نام کاربری:</strong> @${escapeHtml(
            username
          )}`;

      }

      if (data.isAdmin) {

        userHtml +=
          `<br><strong>وضعیت:</strong> 👑 مدیر دوره`;

      } else if (data.hasAccess) {

        userHtml +=
          `<br><strong>وضعیت:</strong> ✅ دسترسی فعال`;

      } else {

        userHtml +=
          `<br><strong>وضعیت:</strong> ❌ بدون دسترسی`;

      }

      document
        .getElementById("userInfo")
        .innerHTML =
        userHtml;

      const accessMessage =
        document.getElementById(
          "accessMessage"
        );

      if (
        !data.isAdmin &&
        !data.hasAccess
      ) {

        accessMessage
          .classList
          .remove("hidden");

        accessMessage.innerHTML = `
          <h2>🔒 دسترسی به دوره</h2>

          <p>
            حساب شما هنوز دسترسی فعال به آموزش‌های دوره ندارد.
          </p>

          <p>
            برای ثبت‌نام و فعال‌سازی دسترسی،
            با پشتیبانی دوره در ارتباط باشید.
          </p>

          <strong>
            آیدی ثبت‌نام:
            o0JABBAR0o
          </strong>
        `;

      }

      if (
        data.lessons &&
        data.lessons.length > 0
      ) {

        document
          .getElementById("lessonsSection")
          .classList
          .remove("hidden");

        renderLessons(
          data.lessons
        );

      }

      if (data.isAdmin) {

        document
          .getElementById("adminPanel")
          .classList
          .remove("hidden");

      }

    }

    function renderLessons(lessons) {

      const list =
        document.getElementById(
          "lessonsList"
        );

      list.innerHTML = "";

      lessons.forEach(
        (lesson, index) => {

          const div =
            document.createElement(
              "div"
            );

          div.className =
            "lesson";

          const number =
            index + 1;

          let html = `

            <div class="lesson-number">
              آموزش ${number}
            </div>

            <div class="lesson-title">
              ${escapeHtml(
                lesson.title || ""
              )}
            </div>

          `;

          if (lesson.description) {

            html += `
              <div class="lesson-description">
                ${escapeHtml(
                  lesson.description
                )}
              </div>
            `;

          }

          const url =
            lesson.content_url;

          if (
            lesson.content_type ===
            "video" &&
            url
          ) {

            html += `
              <video
                controls
                controlsList="nodownload noplaybackrate"
                disablePictureInPicture
                playsinline
                oncontextmenu="return false;"
              >
                <source src="${escapeAttribute(
                  url
                )}">
                مرورگر شما از پخش ویدئو پشتیبانی نمی‌کند.
              </video>
            `;

          }

          else if (
            lesson.content_type ===
            "audio" &&
            url
          ) {

            html += `
              <audio
                controls
                controlsList="nodownload"
                oncontextmenu="return false;"
              >
                <source src="${escapeAttribute(
                  url
                )}">
              </audio>
            `;

          }

          else if (
            lesson.content_type ===
            "image" &&
            url
          ) {

            html += `
              <img
                class="content-image"
                src="${escapeAttribute(
                  url
                )}"
                draggable="false"
                oncontextmenu="return false;"
              >
            `;

          }

          else if (
            lesson.content_type ===
            "file" &&
            url
          ) {

            html += `
              <iframe
                src="${escapeAttribute(
                  url
                )}"
                oncontextmenu="return false;"
              ></iframe>
            `;

          }

          else if (
            lesson.content_type ===
            "text"
          ) {

            html += `
              <div class="text-content">
                ${escapeHtml(
                  url || ""
                )}
              </div>
            `;

          }

          else if (url) {

            html += `
              <a
                href="${escapeAttribute(
                  url
                )}"
                target="_blank"
                rel="noopener noreferrer"
              >
                مشاهده محتوا
              </a>
            `;

          }

          else {

            html += `
              <p>
                محتوای این آموزش هنوز قرار نگرفته است.
              </p>
            `;

          }

          div.innerHTML =
            html;

          list.appendChild(
            div
          );

        }
      );

    }
        document
      .getElementById("contentType")
      .addEventListener(
        "change",
        function () {

          const type =
            this.value;

          const fileBox =
            document.getElementById(
              "fileBox"
            );

          const textBox =
            document.getElementById(
              "textBox"
            );

          if (type === "text") {

            fileBox
              .classList
              .add("hidden");

            textBox
              .classList
              .remove("hidden");

          } else {

            fileBox
              .classList
              .remove("hidden");

            textBox
              .classList
              .add("hidden");

          }

        }
      );

    document
      .getElementById("lessonForm")
      .addEventListener(
        "submit",
        async function (event) {

          event.preventDefault();

          const button =
            document.getElementById(
              "submitButton"
            );

          const message =
            document.getElementById(
              "adminMessage"
            );

          try {

            button.disabled =
              true;

            message.innerText =
              "در حال ثبت آموزش...";

            const title =
              document
                .getElementById("title")
                .value
                .trim();

            const description =
              document
                .getElementById("description")
                .value
                .trim();

            const contentType =
              document
                .getElementById("contentType")
                .value;

            const publishAt =
              document
                .getElementById("publishAt")
                .value;

            let contentUrl =
              null;

            if (
              contentType ===
              "text"
            ) {

              contentUrl =
                document
                  .getElementById(
                    "textContent"
                  )
                  .value
                  .trim();

              if (!contentUrl) {

                throw new Error(
                  "متن آموزش را وارد کنید."
                );

              }

            }

            else {

              const file =
                document
                  .getElementById(
                    "file"
                  )
                  .files[0];

              if (!file) {

                throw new Error(
                  "لطفاً فایل آموزش را انتخاب کنید."
                );

              }

              if (
                file.size >
                50 * 1024 * 1024
              ) {

                throw new Error(
                  "حجم فایل بیشتر از ۵۰ مگابایت است."
                );

              }

              message.innerText =
                "در حال آماده‌سازی آپلود...";

              const uploadResponse =
                await fetch(
                  "/api/upload-url",
                  {
                    method: "POST",

                    headers: {
                      "Content-Type":
                        "application/json"
                    },

                    body:
                      JSON.stringify({
                        initData:
                          initData,

                        fileName:
                          file.name,

                        contentType:
                          file.type ||
                          "application/octet-stream"
                      })
                  }
                );

              const uploadData =
                await uploadResponse.json();

              if (
                !uploadResponse.ok ||
                !uploadData.ok
              ) {

                throw new Error(
                  uploadData.error ||
                  "خطا در دریافت لینک آپلود"
                );

              }

              message.innerText =
                "در حال آپلود فایل...";

              const uploadUrl =
                `${getSupabaseUrl()}/storage/v1/object/upload/sign/course-videos/${encodeURIComponent(
                  uploadData.path
                )}?token=${encodeURIComponent(
                  uploadData.token
                )}`;

              const fileResponse =
                await fetch(
                  uploadUrl,
                  {
                    method: "PUT",

                    headers: {
                      "Content-Type":
                        file.type ||
                        "application/octet-stream"
                    },

                    body: file
                  }
                );

              if (!fileResponse.ok) {

                const text =
                  await fileResponse.text();

                console.error(
                  "Upload Error:",
                  text
                );

                throw new Error(
                  "آپلود فایل ناموفق بود."
                );

              }

              contentUrl =
                uploadData.path;

            }

            message.innerText =
              "در حال ثبت آموزش در دوره...";

            const lessonResponse =
              await fetch(
                "/api/create-lesson",
                {
                  method: "POST",

                  headers: {
                    "Content-Type":
                      "application/json"
                  },

                  body:
                    JSON.stringify({
                      initData:
                        initData,

                      title:
                        title,

                      description:
                        description,

                      contentType:
                        contentType,

                      contentUrl:
                        contentUrl,

                      publishAt:
                        publishAt
                          ? new Date(
                              publishAt
                            ).toISOString()
                          : null
                    })
                }
              );

            const lessonData =
              await lessonResponse.json();

            if (
              !lessonResponse.ok ||
              !lessonData.ok
            ) {

              throw new Error(
                lessonData.error ||
                "خطا در ثبت آموزش"
              );

            }

            message.innerHTML =
              `<span class="success">
                ✅ آموزش با موفقیت اضافه شد.
              </span>`;

            document
              .getElementById(
                "lessonForm"
              )
              .reset();

            setTimeout(
              authenticate,
              800
            );

          } catch (error) {

            console.error(
              "Create Lesson Error:",
              error
            );

            message.innerHTML =
              `<span class="error">
                ❌ ${escapeHtml(
                  error.message
                )}
              </span>`;

          } finally {

            button.disabled =
              false;

          }

        }
      );

    let supabaseUrlCache =
      null;

    async function getSupabaseUrl() {

      if (
        supabaseUrlCache
      ) {

        return supabaseUrlCache;

      }

      const response =
        await fetch(
          "/api/config"
        );

      const data =
        await response.json();

      if (
        !response.ok ||
        !data.ok
      ) {

        throw new Error(
          "تنظیمات Supabase دریافت نشد."
        );

      }

      supabaseUrlCache =
        data.supabaseUrl;

      return supabaseUrlCache;

    }

    document.addEventListener(
      "contextmenu",
      function (event) {

        event.preventDefault();

      }
    );

    document.addEventListener(
      "dragstart",
      function (event) {

        event.preventDefault();

      }
    );

    document.addEventListener(
      "keydown",
      function (event) {

        if (
          event.ctrlKey ||
          event.metaKey
        ) {

          const key =
            event.key.toLowerCase();

          if (
            key === "s" ||
            key === "u" ||
            key === "c" ||
            key === "a"
          ) {

            event.preventDefault();

          }

        }

      }
    );

    function escapeHtml(value) {

      return String(value)
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );

    }

    function escapeAttribute(value) {

      return escapeHtml(
        value
      );

    }

    authenticate();

  </script>

</body>

</html>
