<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>باهوش | دوره هوش مصنوعی</title>

<script src="https://developer.eitaa.com/eitaa-web-app.js"></script>

<style>

*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html,body{
margin:0;
padding:0;
width:100%;
min-height:100%;
background:#080b12;
color:#fff;
font-family:Tahoma,Arial,sans-serif;
}

body{
min-height:100vh;
overflow-x:hidden;
}

button,input,textarea,select{
font-family:inherit;
}

button{
border:0;
outline:0;
cursor:pointer;
}

.app{
width:100%;
min-height:100vh;
padding:18px;
}

.loading{
min-height:90vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
gap:18px;
text-align:center;
}

.loader{
width:48px;
height:48px;
border-radius:50%;
border:4px solid rgba(255,255,255,.12);
border-top-color:#00e5ff;
animation:spin 1s linear infinite;
}

@keyframes spin{
to{transform:rotate(360deg)}
}

.loading-text{
color:#b9c2d0;
font-size:14px;
}

.hidden{
display:none!important;
}

.header{
padding:20px;
border-radius:24px;
background:linear-gradient(
145deg,
rgba(0,229,255,.13),
rgba(138,43,226,.10)
);
border:1px solid rgba(255,255,255,.08);
box-shadow:0 0 30px rgba(0,229,255,.06);
margin-bottom:18px;
}

.brand{
font-size:27px;
font-weight:900;
margin-bottom:7px;
}

.subtitle{
color:#aeb7c7;
font-size:13px;
line-height:1.8;
}

.user-card{
margin-top:16px;
padding:14px;
border-radius:17px;
background:rgba(255,255,255,.045);
border:1px solid rgba(255,255,255,.06);
}

.user-name{
font-weight:700;
font-size:15px;
}

.user-id{
color:#8994a6;
font-size:11px;
margin-top:5px;
direction:ltr;
text-align:right;
}

.message{
padding:16px;
border-radius:18px;
background:rgba(255,255,255,.045);
border:1px solid rgba(255,255,255,.07);
line-height:2;
font-size:14px;
color:#dbe2ed;
margin-bottom:16px;
}

.message.error{
border-color:rgba(255,70,90,.25);
color:#ff9da8;
}

.message.success{
border-color:rgba(0,255,170,.22);
color:#8fffd8;
}

.section-title{
font-size:17px;
font-weight:800;
margin:24px 2px 12px;
}

.lessons{
display:flex;
flex-direction:column;
gap:12px;
}

.lesson-card{
width:100%;
padding:17px;
border-radius:20px;
background:rgba(255,255,255,.045);
border:1px solid rgba(255,255,255,.07);
transition:transform .2s ease,border-color .2s ease;
}

.lesson-card:active{
transform:scale(.985);
border-color:rgba(0,229,255,.35);
}

.lesson-number{
color:#00e5ff;
font-size:11px;
font-weight:800;
margin-bottom:8px;
}

.lesson-title{
font-size:16px;
font-weight:800;
line-height:1.8;
}

.lesson-description{
margin-top:7px;
color:#929daf;
font-size:12px;
line-height:1.9;
}

.lesson-type{
display:inline-block;
margin-top:11px;
padding:5px 9px;
border-radius:9px;
background:rgba(0,229,255,.08);
color:#65edff;
font-size:10px;
}
  .lesson-detail{
animation:fadeIn .25s ease;
}

@keyframes fadeIn{
from{
opacity:0;
transform:translateY(8px);
}
to{
opacity:1;
transform:translateY(0);
}
}

.back-button{
width:100%;
padding:13px 16px;
margin-bottom:15px;
border-radius:15px;
background:rgba(255,255,255,.06);
color:#fff;
border:1px solid rgba(255,255,255,.08);
font-size:13px;
font-weight:700;
}

.detail-title{
font-size:22px;
font-weight:900;
line-height:1.7;
margin-bottom:10px;
}

.detail-description{
color:#aeb7c7;
font-size:13px;
line-height:2;
margin-bottom:18px;
}

.content-box{
width:100%;
padding:14px;
border-radius:20px;
background:rgba(255,255,255,.035);
border:1px solid rgba(255,255,255,.07);
overflow:hidden;
}

.content-box video,
.content-box audio,
.content-box img{
display:block;
width:100%;
max-width:100%;
border-radius:14px;
}

.content-box video{
background:#000;
}

.content-text{
white-space:pre-wrap;
color:#dce3ee;
font-size:14px;
line-height:2.2;
word-break:break-word;
}

.download-warning{
margin-top:12px;
color:#7f8999;
font-size:10px;
text-align:center;
}

.admin-panel{
margin-top:24px;
padding:18px;
border-radius:22px;
background:linear-gradient(
145deg,
rgba(138,43,226,.12),
rgba(0,229,255,.07)
);
border:1px solid rgba(255,255,255,.08);
}

.admin-title{
font-size:17px;
font-weight:900;
margin-bottom:15px;
}

.field{
margin-bottom:12px;
}

.field label{
display:block;
margin-bottom:6px;
color:#9da8b9;
font-size:11px;
}

.field input,
.field textarea,
.field select{
width:100%;
border:1px solid rgba(255,255,255,.08);
outline:none;
border-radius:13px;
padding:12px;
background:rgba(0,0,0,.25);
color:#fff;
font-size:13px;
}

.field textarea{
min-height:90px;
resize:vertical;
line-height:1.8;
}

.field select option{
background:#10141d;
color:#fff;
}

.file-input{
padding:10px!important;
}

.admin-button{
width:100%;
padding:13px;
border-radius:14px;
background:linear-gradient(
135deg,
#00cfe8,
#7c3aed
);
color:#fff;
font-size:13px;
font-weight:900;
margin-top:4px;
}

.admin-button:disabled{
opacity:.55;
}

.status{
margin-top:12px;
font-size:12px;
line-height:1.8;
color:#aeb7c7;
text-align:center;
}

</style>
</head>

<body>

<div class="app">

<div id="loading" class="loading">

<div class="loader"></div>

<div class="loading-text">
در حال بررسی اطلاعات شما...
</div>

</div>

<div id="appContent" class="hidden">

<div class="header">

<div class="brand">
باهوش 🤖
</div>

<div class="subtitle">
دستیار دوره آموزشی هوش مصنوعی
</div>

<div class="user-card">

<div id="userName" class="user-name">
...
</div>

<div id="userId" class="user-id">
...
</div>

</div>

</div>

<div id="message" class="message hidden"></div>

<div id="homeView">

<div class="section-title">
آموزش‌های دوره 📚
</div>

<div id="lessons" class="lessons"></div>

</div>

<div id="detailView" class="lesson-detail hidden">

<button id="backButton"
class="back-button"
type="button">
← بازگشت
</button>

<div id="detailTitle"
class="detail-title">
</div>

<div id="detailDescription"
class="detail-description">
</div>

<div id="detailContent"
class="content-box">
</div>

</div>

<div id="adminPanel"
class="admin-panel hidden">

<div class="admin-title">
پنل مدیریت آموزش‌ها ⚙️
</div>

<div class="field">

<label>عنوان آموزش</label>

<input
id="lessonTitle"
type="text"
placeholder="مثلاً آموزش ساخت تصویر"
>

</div>

<div class="field">

<label>توضیحات</label>

<textarea
id="lessonDescription"
placeholder="توضیحات کوتاه آموزش..."
></textarea>

</div>

<div class="field">

<label>نوع محتوا</label>

<select id="contentType">

<option value="video">ویدئو</option>
<option value="audio">صوت</option>
<option value="image">تصویر</option>
<option value="file">فایل</option>
<option value="text">متن</option>

</select>

</div>

<div class="field">

<label>فایل آموزش</label>

<input
id="lessonFile"
class="file-input"
type="file"
>

</div>

<div class="field">

<label>زمان انتشار</label>

<input
id="publishAt"
type="datetime-local"
>

</div>

<button
id="uploadButton"
class="admin-button"
type="button"
>
افزودن آموزش
</button>

<div id="uploadStatus" class="status"></div>

</div>

</div>

</div>
<script>

(function(){

"use strict";

var webApp=null;

try{

if(window.Eitaa&&window.Eitaa.WebApp){

webApp=window.Eitaa.WebApp;

webApp.ready();
webApp.expand();

}

}catch(error){
console.log("Eitaa SDK:",error);
}

var initData="";

try{

if(webApp&&webApp.initData){
initData=webApp.initData;
}

}catch(error){
console.log("initData:",error);
}

var loading=
document.getElementById("loading");

var appContent=
document.getElementById("appContent");

var message=
document.getElementById("message");

var userName=
document.getElementById("userName");

var userId=
document.getElementById("userId");

var lessonsBox=
document.getElementById("lessons");

var homeView=
document.getElementById("homeView");

var detailView=
document.getElementById("detailView");

var backButton=
document.getElementById("backButton");

var detailTitle=
document.getElementById("detailTitle");

var detailDescription=
document.getElementById("detailDescription");

var detailContent=
document.getElementById("detailContent");

var adminPanel=
document.getElementById("adminPanel");

var lessonTitle=
document.getElementById("lessonTitle");

var lessonDescription=
document.getElementById("lessonDescription");

var contentType=
document.getElementById("contentType");

var lessonFile=
document.getElementById("lessonFile");

var publishAt=
document.getElementById("publishAt");

var uploadButton=
document.getElementById("uploadButton");

var uploadStatus=
document.getElementById("uploadStatus");

var lessons=[];
var isAdmin=false;

function showMessage(text,type){

message.textContent=text;
message.className="message";

if(type){
message.classList.add(type);
}

message.classList.remove("hidden");

}

function hideMessage(){
message.classList.add("hidden");
}

function escapeHtml(value){

if(value===null||value===undefined){
return "";
}

return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

function contentTypeLabel(type){

if(type==="video")return"ویدئو";
if(type==="audio")return"صوت";
if(type==="image")return"تصویر";
if(type==="file")return"فایل";
if(type==="text")return"متن";

return"محتوا";

}

function renderLessons(){

lessonsBox.innerHTML="";

if(!lessons.length){

lessonsBox.innerHTML=
'<div class="message">'+
"هنوز آموزشی برای نمایش وجود ندارد."+
"</div>";

return;

}

lessons.forEach(function(lesson,index){

var card=
document.createElement("div");

card.className="lesson-card";

card.innerHTML=
'<div class="lesson-number">'+
"آموزش "+(index+1)+
"</div>"+

'<div class="lesson-title">'+
escapeHtml(lesson.title)+
"</div>"+

'<div class="lesson-description">'+
escapeHtml(lesson.description||"")+
"</div>"+

'<div class="lesson-type">'+
escapeHtml(
contentTypeLabel(
lesson.content_type
)
)+
"</div>";

card.addEventListener(
"click",
function(){
openLesson(lesson);
}
);

lessonsBox.appendChild(card);

});

}

function openLesson(lesson){

homeView.classList.add("hidden");
adminPanel.classList.add("hidden");

detailView.classList.remove("hidden");

detailTitle.textContent=
lesson.title||"";

detailDescription.textContent=
lesson.description||"";

renderContent(lesson);

window.scrollTo(0,0);

}

function renderContent(lesson){

detailContent.innerHTML="";

var type=lesson.content_type;
var url=lesson.content_url;

if(type==="video"){

var video=
document.createElement("video");

video.src=url||"";
video.controls=true;
video.playsInline=true;

video.setAttribute(
"controlsList",
"nodownload noplaybackrate"
);

video.addEventListener(
"contextmenu",
function(e){
e.preventDefault();
}
);

detailContent.appendChild(video);

}else if(type==="audio"){

var audio=
document.createElement("audio");

audio.src=url||"";
audio.controls=true;

audio.setAttribute(
"controlsList",
"nodownload"
);

detailContent.appendChild(audio);

}else if(type==="image"){

var image=
document.createElement("img");

image.src=url||"";
image.alt="محتوای آموزشی";

image.addEventListener(
"contextmenu",
function(e){
e.preventDefault();
}
);

detailContent.appendChild(image);

}else if(type==="text"){

var text=
document.createElement("div");

text.className="content-text";
text.textContent=url||"";

detailContent.appendChild(text);

}else if(type==="file"){

var fileMessage=
document.createElement("div");

fileMessage.className="content-text";
fileMessage.textContent=
"فایل آموزشی آماده است.";

detailContent.appendChild(fileMessage);

if(url){

var link=
document.createElement("a");

link.href=url;
link.target="_blank";
link.rel="noopener";
link.textContent="مشاهده فایل";

link.style.display="block";
link.style.marginTop="15px";
link.style.color="#00e5ff";

detailContent.appendChild(link);

}

}else{

var unknown=
document.createElement("div");

unknown.className="content-text";
unknown.textContent=
"نوع این محتوا پشتیبانی نمی‌شود.";

detailContent.appendChild(unknown);

}

var warning=
document.createElement("div");

warning.className="download-warning";

warning.textContent=
"محتوای دوره برای استفاده داخل برنامه ارائه شده است.";

detailContent.appendChild(warning);

}
  backButton.addEventListener(
"click",
function(){

detailView.classList.add("hidden");
homeView.classList.remove("hidden");

if(isAdmin){
adminPanel.classList.remove("hidden");
}

window.scrollTo(0,0);

}
);

function showMainInterface(){

loading.classList.add("hidden");
appContent.classList.remove("hidden");

}

function loadUserData(data){

if(!data||!data.ok){

showMessage(
data&&data.error
?data.error
:"دریافت اطلاعات شما ناموفق بود.",
"error"
);

showMainInterface();
return;

}

isAdmin=!!data.isAdmin;

var user=data.user||{};

var fullName=
(user.first_name||"")+" "+
(user.last_name||"");

fullName=fullName.trim();

userName.textContent=
fullName||
user.username||
"کاربر دوره";

userId.textContent=
"Eitaa ID: "+(user.id||"-");

lessons=
Array.isArray(data.lessons)
?data.lessons:[];

renderLessons();

if(isAdmin){

adminPanel.classList.remove("hidden");

showMessage(
"شما به عنوان مدیر وارد شده‌اید.",
"success"
);

}else if(!data.hasAccess){

showMessage(
"دسترسی شما به دوره فعال نیست.",
"error"
);

}else{

hideMessage();

}

showMainInterface();

}

async function authenticate(){

if(!initData){

showMessage(
"اطلاعات ورود ایتا دریافت نشد. لطفاً برنامه را از داخل ایتا باز کنید.",
"error"
);

showMainInterface();
return;

}

try{

var response=
await fetch("/api/auth",{

method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({
initData:initData
})

});

var data=
await response.json();

loadUserData(data);

}catch(error){

console.error(
"Auth Error:",
error
);

showMessage(
"ارتباط با سرور برقرار نشد. لطفاً دوباره تلاش کنید.",
"error"
);

showMainInterface();

}

}

async function uploadLesson(){

if(!initData){

uploadStatus.textContent=
"اطلاعات ورود ایتا موجود نیست.";

return;

}

var title=
lessonTitle.value.trim();

var description=
lessonDescription.value.trim();

var type=
contentType.value;

var file=
lessonFile.files&&
lessonFile.files[0];

var publishValue=
publishAt.value;

if(!title){

uploadStatus.textContent=
"عنوان آموزش را وارد کنید.";

return;

}

if(type!=="text"&&!file){

uploadStatus.textContent=
"فایل آموزش را انتخاب کنید.";

return;

}

uploadButton.disabled=true;

uploadButton.textContent=
"در حال ثبت...";

try{

var contentUrl="";

if(type==="text"){

contentUrl=description;

}else{

if(file.size>50*1024*1024){

throw new Error(
"حجم فایل بیشتر از ۵۰ مگابایت است."
);

}

uploadStatus.textContent=
"در حال ساخت لینک آپلود...";

var uploadResponse=
await fetch(
"/api/upload-url",
{

method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({

initData:initData,

fileName:
file.name,

contentType:
file.type||
"application/octet-stream"

})

}
);

var uploadData=
await uploadResponse.json();

if(
!uploadResponse.ok||
!uploadData.ok
){

throw new Error(
uploadData.error||
"ساخت لینک آپلود ناموفق بود."
);

}

uploadStatus.textContent=
"در حال آپلود فایل...";

var safePath=
uploadData.path
.split("/")
.map(
function(part){
return encodeURIComponent(part);
}
)
.join("/");

var supabaseUploadUrl=
"https://ywlqopsuscfzokeqpika.supabase.co"+
"/storage/v1/object/upload/sign/course-videos/"+
safePath+
"?token="+
encodeURIComponent(
uploadData.token
);

var fileResponse=
await fetch(
supabaseUploadUrl,
{

method:"PUT",

headers:{
"Content-Type":
file.type||
"application/octet-stream"
},

body:file

}
);

if(!fileResponse.ok){

var uploadError=
await fileResponse.text();

console.error(
"Storage Upload Error:",
uploadError
);

throw new Error(
"آپلود فایل انجام نشد."
);

}

contentUrl=
uploadData.path;

}

uploadStatus.textContent=
"در حال ثبت آموزش...";

var lessonResponse=
await fetch(
"/api/create-lesson",
{

method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({

initData:initData,

title:title,

description:description,

contentType:type,

contentUrl:contentUrl,

publishAt:
publishValue
?new Date(
publishValue
).toISOString()
:null

})

}
);

var lessonData=
await lessonResponse.json();

if(
!lessonResponse.ok||
!lessonData.ok
){

throw new Error(
lessonData.error||
"ثبت آموزش ناموفق بود."
);

}

uploadStatus.textContent=
"آموزش با موفقیت اضافه شد. ✅";

lessonTitle.value="";
lessonDescription.value="";
lessonFile.value="";
publishAt.value="";

lessons.push(
lessonData.lesson
);

lessons.sort(
function(a,b){

return Number(
a.sort_order||0
)-
Number(
b.sort_order||0
);

}
);

renderLessons();
  }

}catch(error){

console.error(
"Upload Lesson Error:",
error
);

uploadStatus.textContent=
error.message||
"خطایی هنگام ثبت آموزش رخ داد.";

}finally{

uploadButton.disabled=false;

uploadButton.textContent=
"افزودن آموزش";

}

}

uploadButton.addEventListener(
"click",
uploadLesson
);

document.addEventListener(
"contextmenu",
function(event){
event.preventDefault();
}
);

document.addEventListener(
"dragstart",
function(event){
event.preventDefault();
}
);

document.addEventListener(
"selectstart",
function(event){
event.preventDefault();
}
);

document.addEventListener(
"keydown",
function(event){

var key=
String(event.key).toLowerCase();

if(
(event.ctrlKey||event.metaKey)&&
(
key==="s"||
key==="u"||
key==="c"||
key==="a"
)
){

event.preventDefault();

}

}
);

authenticate();

})();

</script>

</body>

</html>
