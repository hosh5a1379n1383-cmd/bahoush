<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <script src="https://developer.eitaa.com/eitaa-web-app.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <title>باهوش</title>

  <style>

    * {
      box-sizing: border-box;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: #070816;
      color: #ffffff;
      font-family: Tahoma, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      width: 260px;
      height: 260px;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.35;
      z-index: 0;
      pointer-events: none;
    }

    body::before {
      background: #6c3cff;
      top: -80px;
      right: -80px;
    }

    body::after {
      background: #00bfff;
      bottom: -100px;
      left: -80px;
    }

    button,
    input,
    textarea,
    select {
      font-family: inherit;
    }

    input,
    textarea,
    select {
      -webkit-user-select: text;
      user-select: text;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      padding: 28px 16px 40px;
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo {
      width: 76px;
      height: 76px;
      margin: 0 auto 14px;
      border-radius: 24px;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 38px;

      background:
        linear-gradient(
          135deg,
          rgba(121, 65, 255, 0.95),
          rgba(0, 191, 255, 0.9)
        );

      box-shadow:
        0 0 25px rgba(102, 68, 255, 0.55),
        0 0 55px rgba(0, 191, 255, 0.18);
    }

    .brand {
      font-size: 28px;
      font-weight: 900;
      margin: 0;
    }

    .subtitle {
      margin: 8px 0 0;
      color: #a9abc4;
      font-size: 13px;
    }

    #status {
      text-align: center;
      color: #b9bbd1;
      font-size: 13px;
      margin: 0 0 20px;
      line-height: 1.8;
    }

    .user-card,
    .admin-card,
    .lesson,
    .lesson-detail {

      position: relative;
      overflow: hidden;

      border-radius: 22px;

      background:
        linear-gradient(
          145deg,
          rgba(255, 255, 255, 0.075),
          rgba(255, 255, 255, 0.035)
        );

      border: 1px solid rgba(255, 255, 255, 0.10);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      box-shadow:
        0 12px 40px rgba(0, 0, 0, 0.25);
    }

    .user-card {
      padding: 20px;
      margin-bottom: 28px;
    }

    .user-name {
      font-size: 19px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .user-row {
      display: flex;
      justify-content: space-between;
      align-items: center;

      padding: 9px 0;

      border-bottom: 1px solid rgba(255, 255, 255, 0.06);

      font-size: 13px;
      color: #b8bad0;
    }

    .user-row:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .user-row strong {
      color: #ffffff;
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 8px;

      font-size: 19px;
      font-weight: 900;

      margin-bottom: 14px;
    }

    .section-title span {
      color: #9b7cff;
    }

    .lesson {
      margin-bottom: 14px;
      padding: 19px;
    }

    .lesson-number,
    .detail-number {

      display: inline-block;

      padding: 5px 10px;
      margin-bottom: 10px;

      border-radius: 10px;

      color: #bcaaff;
      background: rgba(132, 92, 255, 0.12);

      font-size: 11px;
      font-weight: bold;
    }

    .lesson-title {
      font-size: 18px;
      font-weight: 900;
      margin-bottom: 8px;
    }

    .lesson-description {
      color: #aeb0c5;
      font-size: 13px;
      line-height: 1.9;
    }

    .lesson-button,
    .admin-submit {

      width: 100%;

      margin-top: 16px;

      padding: 13px 16px;

      border: none;
      border-radius: 14px;

      color: #ffffff;
      font-size: 14px;
      font-weight: bold;

      background:
        linear-gradient(
          135deg,
          #7047ff,
          #00aeea
        );

      box-shadow:
        0 7px 22px rgba(90, 75, 255, 0.28);

      cursor: pointer;
    }

    .admin-card {
      padding: 20px;
      margin-bottom: 28px;
    }

    .admin-badge {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 10px;

      background: rgba(255, 190, 60, 0.12);
      color: #ffd36b;

      font-size: 11px;
      font-weight: bold;

      margin-bottom: 12px;
    }

    .admin-title {
      font-size: 20px;
      font-weight: 900;
      margin-bottom: 8px;
    }

    .admin-subtitle {
      color: #9fa1b8;
      font-size: 12px;
      line-height: 1.9;
      margin-bottom: 18px;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-label {
      display: block;
      margin-bottom: 7px;

      color: #c9cbe0;
      font-size: 12px;
      font-weight: bold;
    }

    .form-input,
    .form-textarea,
    .form-select {

      width: 100%;

      padding: 13px 14px;

      border-radius: 13px;

      border: 1px solid rgba(255, 255, 255, 0.10);

      outline: none;

      color: #ffffff;

      background: rgba(0, 0, 0, 0.22);

      font-size: 13px;
    }

    .form-textarea {
      min-height: 100px;
      resize: vertical;
      line-height: 1.9;
    }

    .form-input:focus,
    .form-textarea:focus,
    .form-select:focus {
      border-color: rgba(125, 88, 255, 0.65);
    }

    .form-select option {
      background: #111326;
      color: #ffffff;
    }

    .file-box {
      padding: 14px;

      border-radius: 14px;

      border: 1px dashed rgba(255, 255, 255, 0.16);

      background: rgba(255, 255, 255, 0.025);
    }

    .file-input {
      width: 100%;
      color: #bfc1d5;
      font-size: 12px;
    }

    .file-info {
      margin-top: 8px;
      color: #85879d;
      font-size: 11px;
      line-height: 1.8;
    }

    .progress-box {
      display: none;
      margin-top: 14px;
    }

    .progress-text {
      color: #bfc1d5;
      font-size: 11px;
      margin-bottom: 7px;
    }

    .progress-bar {
      width: 100%;
      height: 7px;
      overflow: hidden;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.08);
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      border-radius: 20px;

      background:
        linear-gradient(
          90deg,
          #7047ff,
          #00aeea
        );
    }

    .admin-message {
      display: none;

      margin-top: 14px;
      padding: 12px;

      border-radius: 13px;

      font-size: 12px;
      line-height: 1.8;

      text-align: center;
    }

    .admin-message.success {
      display: block;
      color: #8df0ba;
      background: rgba(35, 190, 110, 0.10);
      border: 1px solid rgba(35, 190, 110, 0.16);
    }

    .admin-message.error {
      display: block;
      color: #ff9f9f;
      background: rgba(255, 70, 70, 0.10);
      border: 1px solid rgba(255, 70, 70, 0.16);
    }

    .lesson-page {
      display: none;
    }

    .back-button {

      width: 100%;
      margin-bottom: 18px;

      padding: 12px 16px;

      border: 1px solid rgba(255, 255, 255, 0.10);
      border-radius: 14px;

      color: #d6d7e8;
      background: rgba(255, 255, 255, 0.055);

      font-size: 13px;
      font-weight: bold;

      cursor: pointer;
    }

    .lesson-detail {
      padding: 22px;
    }

    .detail-title {
      font-size: 23px;
      font-weight: 900;
      line-height: 1.6;
      margin-bottom: 15px;
    }

    .detail-description {
      color: #b5b7ca;
      font-size: 14px;
      line-height: 2;
    }

    .content-box {
      margin-top: 22px;
      overflow: hidden;
      border-radius: 18px;
      background: #000;

      border: 1px solid rgba(255, 255, 255, 0.10);

      box-shadow:
        0 10px 35px rgba(0, 0, 0, 0.35);
    }

    .content-box video,
    .content-box audio,
    .content-box img {

      display: block;
      width: 100%;
      max-width: 100%;
    }

    .content-box video {
      background: #000;
    }

    .content-box audio {
      padding: 12px;
    }

    .content-box img {
      height: auto;
    }

    .text-content {
      margin-top: 22px;
      padding: 20px;

      border-radius: 18px;

      color: #d7d8e6;

      background:
        rgba(255, 255, 255, 0.045);

      border:
        1px solid rgba(255, 255, 255, 0.08);

      font-size: 14px;
      line-height: 2.2;

      white-space: pre-wrap;
      word-break: break-word;
    }

    .content-caption {
      margin: 14px 0 0;

      color: #9294aa;

      font-size: 11px;
      text-align: center;
      line-height: 1.8;
    }

    .empty {
      padding: 25px 15px;
      text-align: center;
      color: #85879d;
      font-size: 13px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.07);
    }

    .hidden {
      display: none !important;
    }

  </style>

</head>

<body
  oncontextmenu="return false"
  onselectstart="return false"
>

  <div class="container">

    <div id="mainPage">

      <div class="header">

        <div class="logo">
          🤖
        </div>

        <h1 class="brand">
          باهوش
        </h1>

        <p class="subtitle">
          مسیر حرفه‌ای یادگیری هوش مصنوعی
        </p>

      </div>

      <p id="status">
        در حال بررسی اطلاعات شما...
      </p>

      <div id="userInfo"></div>

      <div
        id="adminPanel"
        class="hidden"
      ></div>

      <div id="lessons"></div>

    </div>

    <div
      id="lessonPage"
      class="lesson-page"
    >

      <button
        class="back-button"
        type="button"
        onclick="closeLesson()"
      >
        ← بازگشت به آموزش‌ها
      </button>

      <div class="lesson-detail">

        <div
          id="detailNumber"
          class="detail-number"
        ></div>

        <div
          id="detailTitle"
          class="detail-title"
        ></div>

        <div
          id="detailDescription"
          class="detail-description"
        ></div>

        <div id="contentContainer"></div>

      </div>

    </div>

  </div>


  <script>

    const webApp =
      window.Eitaa.WebApp;

    webApp.ready();
    webApp.expand();


    const status =
      document.getElementById("status");

    const userInfo =
      document.getElementById("userInfo");

    const lessonsContainer =
      document.getElementById("lessons");

    const adminPanel =
      document.getElementById("adminPanel");

    const mainPage =
      document.getElementById("mainPage");

    const lessonPage =
      document.getElementById("lessonPage");

    const detailNumber =
      document.getElementById("detailNumber");

    const detailTitle =
      document.getElementById("detailTitle");

    const detailDescription =
      document.getElementById("detailDescription");

    const contentContainer =
      document.getElementById("contentContainer");


    let allLessons = [];
    let currentUser = null;
    let isAdmin = false;


    // =========================
    // راه‌اندازی Supabase
    // =========================

    let supabaseClient = null;


    async function setupSupabase() {

      const response =
        await fetch("/api/config");

      const result =
        await response.json();

      if (!response.ok || !result.ok) {
        throw new Error(
          result.error ||
          "خطا در دریافت تنظیمات"
        );
      }

      supabaseClient =
        window.supabase.createClient(
          result.supabaseUrl,
          result.supabasePublishableKey,
          {
            auth: {
              persistSession: false,
              autoRefreshToken: false
            }
          }
        );
    }


    // =========================
    // ورود
    // =========================

    async function authenticate() {

      try {

        if (!webApp.initData) {
          throw new Error(
            "اطلاعات ورود ایتا دریافت نشد"
          );
        }


        await setupSupabase();


        const response =
          await fetch("/api/auth", {

            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            body: JSON.stringify({
              initData: webApp.initData
            })

          });


        const result =
          await response.json();


        if (!response.ok || !result.ok) {

          throw new Error(
            result.error ||
            "خطای سرور"
          );

        }


        currentUser =
          result.user || {};

        isAdmin =
          !!result.isAdmin;


        const fullName =
          `${currentUser.first_name || ""} ${currentUser.last_name || ""}`
            .trim();


        userInfo.innerHTML = `

          <div class="user-card">

            <div class="user-name">
              👋 ${escapeHtml(
                fullName || "کاربر"
              )}
            </div>

            <div class="user-row">
              <span>
                شناسه ایتا
              </span>

              <strong>
                ${escapeHtml(
                  String(currentUser.id || "")
                )}
              </strong>
            </div>

            <div class="user-row">

              <span>
                وضعیت
              </span>

              <strong>
                ${
                  result.isAdmin
                    ? "ادمین 👑"
                    : result.hasAccess
                      ? "هنرجوی فعال ✅"
                      : "بدون دسترسی 🔒"
                }
              </strong>

            </div>

            <div class="user-row">

              <span>
                ثبت‌نام
              </span>

              <strong>
                ${
                  result.registered
                    ? "تکمیل شده ✅"
                    : "انجام نشده"
                }
              </strong>

            </div>

            <div class="user-row">

              <span>
                دسترسی دوره
              </span>

              <strong>
                ${
                  result.hasAccess || result.isAdmin
                    ? "فعال ✅"
                    : "غیرفعال 🔒"
                }
              </strong>

            </div>

          </div>

        `;


        allLessons =
          result.lessons || [];


        if (isAdmin) {

          renderAdminPanel();

          status.textContent =
            "ورود موفق بود — پنل مدیریت آماده است 👑";

        } else if (result.hasAccess) {

          status.textContent =
            "ورود موفق بود — خوش آمدید 🌱";

        } else if (result.registered) {

          status.textContent =
            "ثبت‌نام شما انجام شده، اما دسترسی دوره فعال نیست.";

        } else {

          status.textContent =
            "شما هنوز در دوره ثبت‌نام نکرده‌اید.";

        }


        renderLessons();


      } catch (error) {

        console.error(error);

        status.textContent =
          error.message ||
          "ارتباط با سرور برقرار نشد ❌";

      }

    }


    // =========================
    // پنل مدیریت
    // =========================

    function renderAdminPanel() {

      adminPanel.classList.remove(
        "hidden"
      );


      adminPanel.innerHTML = `

        <div class="admin-card">

          <div class="admin-badge">
            👑 پنل مدیریت
          </div>

          <div class="admin-title">
            افزودن آموزش جدید
          </div>

          <div class="admin-subtitle">
            آموزش جدید را از همین‌جا اضافه کن.
            شماره آموزش به‌صورت خودکار تعیین می‌شود.
          </div>


          <div class="form-group">

            <label class="form-label">
              عنوان آموزش
            </label>

            <input
              id="lessonTitleInput"
              class="form-input"
              type="text"
              placeholder="مثلاً آموزش ساخت تصویر با هوش مصنوعی"
            >

          </div>


          <div class="form-group">

            <label class="form-label">
              توضیحات آموزش
            </label>

            <textarea
              id="lessonDescriptionInput"
              class="form-textarea"
              placeholder="توضیحات کوتاه آموزش..."
            ></textarea>

          </div>


          <div class="form-group">

            <label class="form-label">
              نوع محتوا
            </label>

            <select
              id="contentTypeInput"
              class="form-select"
              onchange="changeContentType()"
            >

              <option value="video">
                🎬 ویدئو
              </option>

              <option value="audio">
                🎧 صوت
              </option>

              <option value="image">
                🖼️ تصویر
              </option>

              <option value="file">
                📎 فایل
              </option>

              <option value="text">
                📝 متن
              </option>

            </select>

          </div>


          <div
            id="fileArea"
            class="form-group"
          >

            <label class="form-label">
              فایل محتوا
            </label>

            <div class="file-box">

              <input
                id="lessonFileInput"
                class="file-input"
                type="file"
              >

              <div
                id="fileInfo"
                class="file-info"
              >
                حداکثر حجم فعلی فایل: ۵۰ مگابایت
              </div>

            </div>

          </div>


          <div
            id="textArea"
            class="form-group hidden"
          >

            <label class="form-label">
              متن آموزش
            </label>

            <textarea
              id="lessonTextInput"
              class="form-textarea"
              placeholder="متن آموزش را اینجا وارد کنید..."
            ></textarea>

          </div>


          <div class="form-group">

            <label class="form-label">
              زمان انتشار
            </label>

            <input
              id="publishAtInput"
              class="form-input"
              type="datetime-local"
            >

            <div class="file-info">
              اگر خالی بگذاری، آموزش بلافاصله منتشر می‌شود.
            </div>

          </div>


          <button
            id="adminSubmitButton"
            class="admin-submit"
            type="button"
            onclick="createLesson()"
          >
            ➕ افزودن آموزش
          </button>


          <div
            id="uploadProgress"
            class="progress-box"
          >

            <div
              id="progressText"
              class="progress-text"
            >
              در حال آماده‌سازی...
            </div>

            <div class="progress-bar">

              <div
                id="progressFill"
                class="progress-fill"
              ></div>

            </div>

          </div>


          <div
            id="adminMessage"
            class="admin-message"
          ></div>

        </div>

      `;


      const fileInput =
        document.getElementById(
          "lessonFileInput"
        );


      fileInput.addEventListener(
        "change",
        updateFileInfo
      );

    }


    function changeContentType() {

      const type =
        document.getElementById(
          "contentTypeInput"
        ).value;


      const fileArea =
        document.getElementById(
